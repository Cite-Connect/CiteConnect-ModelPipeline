name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/user-embedding-generation-v2' ]
  pull_request:
    branches: [ main, develop ]

env:
  PROJECT_ID: strange-calling-476017-r5
  SERVICE_NAME: citeconnect-backend-api
  REGION: us-central1

jobs:
  # ================================================================
  # Job 1: Always run tests (all branches)
  # ================================================================
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run basic tests
      run: |
        # Just test imports work
        python -c "from app.main import app; print('✅ App imports successfully')"
        
        # Test if models defined
        python -c "from app.models.paper import PaperResponse; print('✅ Models OK')"

    - name: Check code style (optional)
      run: |
        pip install flake8
        flake8 app/ --max-line-length=120 --ignore=E501 || true

  # ================================================================
  # Job 2: Deploy to Cloud Run (only main branch)
  # ================================================================
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker
      run: gcloud auth configure-docker gcr.io

    - name: Build Docker image
      run: |
        docker build --platform linux/amd64 \
          -t gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
          -t gcr.io/$PROJECT_ID/$SERVICE_NAME:latest \
          .

    - name: Push Docker image
      run: |
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA
        docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:latest

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
          --region $REGION \
          --platform managed \
          --port 8000 \
          --memory 4Gi \
          --cpu 2 \
          --timeout 600 \
          --allow-unauthenticated \
          --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
          --set-env-vars SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
          --set-env-vars SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
          --set-env-vars ENVIRONMENT="production"

    - name: Verify deployment
      run: |
        SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
          --region $REGION \
          --format 'value(status.url)')
        
        sleep 30
        curl -f "$SERVICE_URL/health" || exit 1
        echo "✅ Production deployed!"
```