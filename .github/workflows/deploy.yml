---
name: Deploy Dev

on:
  push:
    branches: [ main ]
  workflow_dispatch:


env:
  PROJECT_ID: strange-calling-476017-r5
  SERVICE_NAME: citeconnect-backend-api
  REGION: us-central1

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    needs: []  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download Bias Mitigation Configs from CI
        id: download_bias
        continue-on-error: true  
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            console.log('Looking for latest CI run with bias configs...');
            
            // Get the latest successful CI workflow run for this commit/branch
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: context.ref.replace('refs/heads/', ''),
              status: 'completed',
              per_page: 5
            });
            
            console.log(`Found ${runs.workflow_runs.length} completed CI runs`);
            
            // Find a successful run with artifacts
            let artifactFound = false;
            for (const run of runs.workflow_runs) {
              if (run.conclusion !== 'success') continue;
              
              console.log(`Checking run ${run.id} from ${run.created_at}...`);
              
              try {
                const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                
                const biasArtifact = artifacts.artifacts.find(a => a.name === 'bias-reports');
                
                if (biasArtifact) {
                  console.log(`Found bias-reports artifact (ID: ${biasArtifact.id})`);
                  
                  // Download the artifact
                  const download = await github.rest.actions.downloadArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: biasArtifact.id,
                    archive_format: 'zip'
                  });
                  
                  // Save the zip file
                  fs.writeFileSync('bias-configs.zip', Buffer.from(download.data));
                  console.log('Downloaded bias configs artifact');
                  
                  artifactFound = true;
                  core.setOutput('artifact_found', 'true');
                  core.setOutput('run_id', run.id);
                  break;
                }
              } catch (error) {
                console.log(`Error checking run ${run.id}: ${error.message}`);
              }
            }
            
            if (!artifactFound) {
              console.log('No bias configs found in recent CI runs');
              core.setOutput('artifact_found', 'false');
            }
      
      - name: Extract Bias Configs
        if: steps.download_bias.outputs.artifact_found == 'true'
        run: |
          echo "Extracting bias configs..."
          unzip -o bias-configs.zip -d bias-configs/
          
          # Create directories if they don't exist
          mkdir -p citeconnect-backend/bias_config
          
          # Copy configs to the build context
          if [ -f "bias-configs/bias_mitigation_config.json" ]; then
            cp bias-configs/bias_mitigation_config.json citeconnect-backend/bias_config/
            echo "Copied bias_mitigation_config.json"
          fi
          
          if [ -f "bias-configs/fairness_config.json" ]; then
            cp bias-configs/fairness_config.json citeconnect-backend/
            echo "Copied fairness_config.json"
          fi
          
          echo ""
          echo "Bias Config Summary:"
          if [ -f "citeconnect-backend/bias_config/bias_mitigation_config.json" ]; then
            echo " User-Profile Mitigation: ACTIVE"
          else
            echo " User-Profile Mitigation: MISSING"
          fi
          
          if [ -f "citeconnect-backend/fairness_config.json" ]; then
            echo "Domain Fairness: ACTIVE"
          else
            echo "Domain Fairness: MISSING"
          fi
      
      - name: Create Default Configs (Fallback)
        if: steps.download_bias.outputs.artifact_found != 'true'
        run: |
          echo "No bias configs from CI - creating empty fallback configs"
          echo "   (Deployment will continue without bias mitigation)"
          
          mkdir -p citeconnect-backend/bias_config
          
          # Create minimal empty config for user-profile mitigation
          echo '{
            "cold_start": {
              "minilm": {
                "primary_domain": {"underperforming_slices": [], "boost_factor": 1.0, "min_score_floor": 0.0},
                "research_stage": {"underperforming_slices": [], "boost_factor": 1.0, "min_score_floor": 0.0},
                "reading_level": {"underperforming_slices": [], "boost_factor": 1.0, "min_score_floor": 0.0}
              }
            }
          }' > citeconnect-backend/bias_config/bias_mitigation_config.json
          
          # Create minimal empty config for domain fairness
          echo '{
            "paper_domain_fairness": {
              "under_served_domains": [],
              "domains": {},
              "domain_boost_factor": 1.0
            }
          }' > citeconnect-backend/fairness_config.json
          
          echo "Created fallback configs (no mitigation active)"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 \
            -t gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
            .

      - name: Push to Container Registry
        run: |
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
            --region $REGION \
            --platform managed \
            --port 8000 \
            --memory 4Gi \
            --cpu 2 \
            --timeout 900 \
            --allow-unauthenticated \
            --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --set-env-vars SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --set-env-vars SUPABASE_KEY="${{ secrets.SUPABASE_KEY }}" \
            --set-env-vars ENVIRONMENT="production" \
            --set-env-vars DEBUG="false" \
            --set-env-vars LOG_LEVEL="INFO" \
            --set-env-vars APP_NAME="CiteConnect" \
            --set-env-vars SECRET_KEY="${{ secrets.SECRET_KEY }}" \
            --set-env-vars DEFAULT_EMBEDDING_MODEL="all-MiniLM-L6-v2" \
            --set-env-vars MODEL_CACHE_DIR="./models" \
            --set-env-vars API_V1_PREFIX="/api/v1" \
            --set-env-vars TRANSFORMERS_CACHE="/app/models" \
            --set-env-vars SENTENCE_TRANSFORMERS_HOME="/app/models" \
            --set-env-vars HF_HOME="/app/models"

      - name: Verify Deployment
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --format 'value(status.url)')
          
          echo "🚀 Dev service deployed!"
          echo "URL: $SERVICE_URL"
          echo "Testing health endpoint..."
          
          sleep 30
          
          curl -f "$SERVICE_URL/health" || exit 1
          
          echo "✅ Deployment successful!"
      
      - name: Verify Bias Mitigation Active
        continue-on-error: true 
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --format 'value(status.url)')
          
          echo ""
          echo "=================================================="
          echo "  Verifying Bias Mitigation Configuration"
          echo "=================================================="
          echo ""
          
          # Check if service logs show config loading
          echo "Checking Cloud Run logs for bias config loading..."
          
          # Get recent logs (last 5 minutes)
          gcloud logging read "resource.type=cloud_run_revision AND resource.labels.service_name=$SERVICE_NAME" \
            --limit=50 \
            --format="value(textPayload)" \
            --freshness=5m | grep -i "bias\|mitigation\|fairness" || echo " No bias-related logs found yet"
          
          echo ""
          echo "Bias Mitigation Status:"
          if [ "${{ steps.download_bias.outputs.artifact_found }}" == "true" ]; then
            echo "  Configs deployed from CI run #${{ steps.download_bias.outputs.run_id }}"
            echo "  User-Profile Mitigation: ACTIVE"
            echo "  Domain Fairness: ACTIVE"
          else
            echo "  Configs: FALLBACK (empty configs)"
            echo "  User-Profile Mitigation: INACTIVE"
            echo "  Domain Fairness: INACTIVE"
            echo "  Configs will be active after next successful CI run."
          fi
          
          echo ""
          echo "=================================================="
          
      - name: Deployment Summary
        if: always()
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
            --region $REGION \
            --format 'value(status.url)')
          
          echo ""
          echo "=================================================="
          echo "  DEPLOYMENT SUMMARY"
          echo "=================================================="
          echo "Service: $SERVICE_NAME"
          echo "Region: $REGION"
          echo "URL: $SERVICE_URL"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Bias Mitigation:"
          if [ "${{ steps.download_bias.outputs.artifact_found }}" == "true" ]; then
            echo "  Status: ACTIVE"
            echo "  Source: CI Artifacts (Run #${{ steps.download_bias.outputs.run_id }})"
          else
            echo "  Status: INACTIVE (fallback configs)"
            echo "  Source: Default empty configs"
          fi
          echo "=================================================="